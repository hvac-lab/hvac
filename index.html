<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morris North HVAC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --band: rgba(42,120,214,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); color: var(--ink-2); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--good); } .pill.warn .dot { background: var(--warning); } .pill.bad .dot { background: var(--critical); }
  nav.tabs { display:flex; gap: 4px; padding: 8px 16px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button { border: 1px solid transparent; border-bottom: none; background: none; border-radius: 10px 10px 0 0; padding: 8px 16px; font-size: 15px; color: var(--ink-2); }
  nav.tabs button.on { background: var(--page); border-color: var(--border); color: var(--ink); font-weight: 650; margin-bottom: -1px; }
  button, select, input[type=search], input[type=number], input[type=text] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  input[type=number] { width: 90px; padding: 6px 8px; } input[type=text] { padding: 6px 8px; }
  button { cursor: pointer; } button:hover { background: var(--hover); } button:disabled { opacity: .5; cursor: default; }
  button.on { border-color: var(--ink); font-weight: 650; }
  button.primary { background: var(--s1); color: #fff; border-color: transparent; padding: 10px 18px; font-weight: 600; }
  button.small { padding: 3px 10px; font-size: 13px; }
  button.danger { color: var(--critical); }
  button.google { display:inline-flex; align-items:center; gap:10px; padding: 10px 18px; font-weight: 600; font-size: 16px; background: var(--surface); }
  button.google svg { width: 20px; height: 20px; }
  table.admin td.email { overflow-wrap: anywhere; } table.admin td.act { white-space: nowrap; }
  table.admin form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .adminAdd { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top: 10px; }
  .adminAdd input[type=text] { padding: 8px 10px; font-size: 16px; }   /* 16px keeps iPhones from zooming into the field */
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
  .filters .group { display:flex; gap:4px; }
  .filters label.chk { display:inline-flex; align-items:center; gap:5px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .ahus { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .ahu { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; border-top: 5px solid var(--ac, var(--border)); }
  .card.chart.temp { border-radius: 18px; }
  .ahu h3 { margin: 0; font-size: 15px; } .ahu .where { font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
  .ahu .big { font-size: 34px; font-weight: 650; line-height: 1.1; } .ahu .big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .ahu .row { display:flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-top: 1px solid var(--grid); }
  .ahu .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .ahu .row.bad { background: rgba(208,59,59,.10); margin: 0 -16px; padding-left: 16px; padding-right: 16px; } .ahu .row.bad span:last-child { color: var(--critical); }
  .ahu .foot { font-size: 11px; color: var(--muted); margin-top: 6px; display:flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .badge.ovr { border-color: var(--warning); } .badge.unr, .badge.err, .badge.critical { border-color: var(--critical); color: var(--critical); }
  .badge.alm, .badge.warning { border-color: var(--serious); } .badge.ok { border-color: var(--good); color: var(--good); }
  .chart { margin-bottom: 14px; }
  .chart h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .uplot { font-family: inherit; }
  .u-legend { font-size: 12px; color: var(--ink-2); }
  .u-legend .u-marker { border-radius: 2px; }
  .u-legend .u-value { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .u-select { background: var(--band); }
  .u-cursor-x { border-right: 1px dashed var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tablewrap { max-height: 60vh; overflow: auto; }
  .center { max-width: 460px; margin: 10vh auto; text-align: center; }
  .center p { color: var(--ink-2); }
  td.ctr, th.ctr { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.desc { color: var(--ink-2); }
  .dim { opacity: .5; }
  .ctl { display: grid; grid-template-columns: 1.4fr auto auto auto auto 1.6fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
  .ctl .name { font-weight: 600; } .ctl .name small { font-weight: 400; color: var(--muted); display: block; font-size: 12px; }
  .ctl .cur { font-variant-numeric: tabular-nums; }
  .ctl .last { font-size: 12px; color: var(--ink-2); }
  .rules input[type=text] { width: 100%; min-width: 170px; } .rules select { padding: 4px 6px; } .rules input[type=number] { width: 72px; padding: 4px 6px; }
  .alert { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
  .alert time { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 110px; }
  .msg { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .map { position: relative; display: inline-block; max-width: 100%; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .map img { display: block; max-width: 100%; max-height: calc(100vh - 150px); width: auto; height: auto; }
  .spot { position: absolute; transform: translate(-50%, -50%); background: var(--surface); border: 3px solid var(--sc, var(--s1)); border-radius: 16px; padding: 8px 18px; font-size: 28px; font-weight: 650; white-space: nowrap; box-shadow: 0 3px 12px rgba(0,0,0,.25); line-height: 1.15; text-align: center; }
  .spot small { display:block; font-size: 14px; font-weight: 400; color: var(--muted); }
  .spot.sm { font-size: 15px; padding: 2px 7px; border-radius: 8px; border-width: 2px; border-style: dashed; box-shadow: 0 1px 4px rgba(0,0,0,.2); } .spot.sm small { font-size: 9px; }
  /* The floor plan is laid out at the picture's own size (1219 px, boxes included) and then the whole thing is scaled
     down to the screen width (fitMap), so a phone sees the entire plan at once and pinches in to read a box; the boxes
     shrink with the picture and never pile up (Russ, 2026-11-05/06). .mapfit clips the unscaled layout box. */
  .mapfit { overflow: hidden; }
  /* Boiler room drawing: pipes with moving dashes where water is being pumped */
  .broom svg { max-width: 1100px; margin: 0 auto; }
  .ahusvg svg, .loopsvg svg, .fansvg svg { max-width: 1100px; margin: 0 auto; }
  .ahusvg .pipe.flow, .loopsvg .pipe.flow, .fansvg .pipe.flow { stroke-dasharray: 10 7; animation: pipeflow 1.2s linear infinite; }
  .broom .pipe.flow { stroke-dasharray: 10 7; animation: pipeflow 1.2s linear infinite; }
  @keyframes pipeflow { to { stroke-dashoffset: -17; } }
  hr.sep { border: 0; border-top: 2px solid var(--axis); margin: 20px 0 14px; }
  .boilers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; text-align: center; }
  .boiler h3 { margin: 0 0 6px; font-size: 19px; }
  .boiler .t { font-size: 30px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; } .boiler .lbl { font-size: 12px; color: var(--muted); }
  .boiler img { height: 200px; width: auto; margin: 6px auto; display: block; }
  .boiler .imgwrap { position: relative; display: inline-block; }
  .boiler .st { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content; max-width: 230px; font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 16px; color: #fff; background: #5a5955; letter-spacing: .02em; box-shadow: 0 2px 10px rgba(0,0,0,.45); border: 2px solid #fff; line-height: 1.2; }
  .boiler .st b { display: block; } .boiler .st small { display: block; font-size: 11px; font-weight: 500; opacity: .95; margin-top: 2px; }
  .boiler .st.ok { background: #0b7a0b; } .boiler .st.err { background: #b00020; } .boiler .st.warn { background: #b36b00; }
  main.wide { max-width: none; padding: 10px; }
  .map.full { display: block; width: 100%; max-width: none; } .map.full img { width: 100%; max-width: none; max-height: none; height: auto; }
  .spot-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  table.vals tbody tr:hover td { background: var(--hover); }
  table.vals td.num, table.vals th.num { font-weight: 600; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; } th.sortable:hover { color: var(--ink); text-decoration: underline; }
  th.sortable[data-dir="asc"]::after { content: " \25B2"; font-size: 9px; } th.sortable[data-dir="desc"]::after { content: " \25BC"; font-size: 9px; }
  summary::-webkit-details-marker { display: none; }
  details.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  details.sec > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.sec > summary::before { content: "▸"; font-size: 12px; } details.sec[open] > summary::before { content: "▾"; }
  details.sec > .body { margin-top: 8px; }
  details.sec > summary .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .spot abbr, .row abbr { text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; }
  .coords { position: absolute; right: 8px; bottom: 8px; font: 12px/1.2 monospace; background: rgba(0,0,0,.65); color: #fff; padding: 3px 6px; border-radius: 6px; pointer-events: none; }
  .sched-card { border-top: 5px solid var(--ac, var(--border)); border-radius: 18px; }
  .sched { display: grid; grid-template-columns: 38px 1fr minmax(150px, 0.55fr); gap: 7px 10px; align-items: center; font-size: 13px; }
  .sched .ticks { grid-column: 2; position: relative; height: 14px; font-size: 10px; color: var(--muted); }
  .sched .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .sched .day { grid-column: 1; color: var(--ink-2); font-weight: 600; }
  /* today: purple day label, purple frame around its bar and purple times (Russ, 2026-11-05) */
  .sched .day.today { color: #fff; background: var(--s7); border-radius: 6px; text-align: center; padding: 1px 0; }
  .sched .bar { grid-column: 2; position: relative; height: 22px; background: var(--grid); border-radius: 6px; }
  .sched .bar.today { outline: 3px solid var(--s7); outline-offset: 2px; }
  .sched .times.today { color: var(--s7); font-weight: 650; }
  .sched .seg { position: absolute; top: 0; bottom: 0; border-radius: 6px; opacity: .9; }
  .sched .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--critical); }
  .sched .times { grid-column: 3; font-size: 12px; color: var(--ink-2); }
  @media (max-width: 760px) { .ctl { grid-template-columns: 1fr 1fr; } .ctl .last { grid-column: 1 / -1; } .sched { grid-template-columns: 34px 1fr; } .sched .times { grid-column: 2; margin-top: -4px; } }
  @media (max-width: 600px) { header h1 { font-size: 16px; } main { padding: 12px; } nav.tabs button { padding: 8px 10px; }
    /* Audit and Details tables on a phone: every column, Description included, on the screen at once in small print;
       pinch to zoom in to read (Russ, 2026-11-06: the What column took the room and Equipment / Description needed
       scrolling; on Details "the description is the most important thing to see") */
    nav.tabs { flex-wrap: wrap; } nav.tabs button { white-space: nowrap; }
    table.audit, table.vals { font-size: 9px; } table.audit th, table.audit td, table.vals th, table.vals td { padding: 2px 3px; }
    table.audit .badge, table.vals .badge { white-space: normal; font-size: 9px; padding: 0 4px; line-height: 1.2; }
    table.audit td.ctr, table.audit th.ctr, table.vals td.num, table.vals th.num { white-space: normal; } table.vals td.hint { font-size: 9px; }
    table.audit pre { font-size: 9px !important; }
    table.admin { font-size: 11px; } table.admin th, table.admin td { padding: 3px 4px; } table.admin .by { display: none; }
    table.admin td.act { white-space: normal; } table.admin td.act button { display: block; margin: 2px 0; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Morris North HVAC</h1>
  <span id="status" class="pill"><span class="dot"></span><span id="statusText">connecting</span></span>
  <span class="spacer"></span>
  <span id="who" class="hint"></span>
  <button id="themeBtn" title="Light / dark">◐</button>
  <button id="signout" style="display:none">Sign out</button>
</header>
<nav class="tabs" id="tabs" style="display:none"></nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
// ------------------------------------------------------------------ building configuration
// The engine names the air handlers by controller (FEC-6/7/8); the Metasys screens call them AHU-1/2/3.
// AHU-1 = FEC-6 was confirmed from logged values on 2026-11-05; AHU-2 = FEC-7 and AHU-3 = FEC-8 confirmed by Russ.
const AHUS = [
  { key: "AHU-1", fec: "FEC-6", name: "AHU-1", where: "Fellowship Area, Main Entry" },
  { key: "AHU-2", fec: "FEC-7", name: "AHU-2", where: "Kitchen and Dining" },
  { key: "AHU-3", fec: "FEC-8", name: "AHU-3", where: "Worship Area" },
];
// Map tab: the floor plan lives in the private Supabase storage bucket "web" as map.png (upload with
// `cli upload-file web\map.png`); allowed users get a signed link. Spots: x/y in percent of the picture's
// width/height (the Map tab shows the pointer's x/y to help place them). Floor plan from Russ, 2026-11-05.
const MAP = {
  bucket: "web", image: "map.png",
  spots: [
    // hum = a humidity point shown under the temperature (the AHUs measure it in their return air duct)
    { label: "Kitchen and Dining", point: "FEC-7.ZN-T", hum: "FEC-7.RA-H", x: 43, y: 38 },
    { label: "Fellowship Area", point: "FEC-6.ZN-T", hum: "FEC-6.RA-H", x: 43, y: 68 },
    { label: "Worship", point: "FEC-8.ZN-T", hum: "FEC-8.RA-H", x: 79, y: 72 },
    { label: "Outdoor", point: "FEC-6.OA-T", hum: "FEC-6.OA-H", x: 69, y: 27 },   // over the patio (Russ, 2026-11-05)
    // Other sensors the plan set shows (HVAC plan M2.2 / hydronic plan M3.2): FCU-1 in the Sound Room (FEC-9),
    // the vestibule cabinet heaters CUH-1/2 whose controller FEC-10 has its own zone sensor.
    { label: "Sound Room (FCU-1)", point: "FEC-9.FCU1-ZN-T", x: 54, y: 88, sm: true },
    { label: "Vestibule (CUH-1/2)", point: "FEC-10.ZN-T", x: 7, y: 76, sm: true },
    // In-floor slab zones. x/y = where the box sits (the floor area the zone heats, judged from the tubing on hydronic
    // plan M3.2); sx/sy = the S1 slab sensor beside manifold MAN-N (from the plan, mapped through shared room labels).
    // Assumes slab zone N = manifold MAN-N. A line is drawn from each box to its sensor.
    { label: "Floor zone 1", point: "FEC-5.ZN1SLAB-T", x: 83, y: 57, sx: 79.1, sy: 63.0, sm: true },
    { label: "Floor zone 2", point: "FEC-5.ZN2SLAB-T", x: 88, y: 80, sx: 88.1, sy: 64.4, sm: true },
    { label: "Floor zone 3", point: "FEC-5.ZN3SLAB-T", x: 84, y: 88, sx: 78.3, sy: 85.4, sm: true },
    { label: "Floor zone 4", point: "FEC-5.ZN4SLAB-T", x: 16, y: 88, sx: 23.9, sy: 86.0, sm: true },
    { label: "Floor zone 5", point: "FEC-5.ZN5SLAB-T", x: 14, y: 67, sx: 8.5, sy: 61.1, sm: true },  // right of the vestibule (Russ, 2026-11-05)
    { label: "Floor zone 6", point: "FEC-5.ZN6SLAB-T", x: 23, y: 71, sx: 21.6, sy: 63.0, sm: true },
    { label: "Floor zone 7", point: "FEC-5.ZN7SLAB-T", x: 20, y: 56, sx: 23.0, sy: 53.6, sm: true },
    { label: "Floor zone 8", point: "FEC-5.ZN8SLAB-T", x: 37, y: 45, sx: 32.8, sy: 52.1, sm: true },  // dining room (Russ, 2026-11-05)
    { label: "Floor zone 9", point: "FEC-5.ZN9SLAB-T", x: 31, y: 68, sx: 33.5, sy: 58.5, sm: true },   // just left of the Fellowship Area box (Russ, 2026-11-06)
    { label: "Floor zone 10", point: "FEC-5.ZN10SLAB-T", x: 57, y: 78, sx: 56.1, sy: 64.3, sm: true },
    { label: "Floor zone 11", point: "FEC-5.ZN11SLAB-T", x: 44, y: 22, sx: 52.8, sy: 16.0, sm: true },
  ],
};

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const opt = (value, text, selected) => { const o = el("option", { value }, text); if (selected) o.selected = true; return o; };
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const RANGES = { "24h": { sec: 86400, table: "hvac_samples_1m", label: "24 hours" },
                 "7d":  { sec: 7 * 86400, table: "hvac_rollup_15m", label: "7 days" },
                 "30d": { sec: 30 * 86400, table: "hvac_rollup_15m", label: "30 days" },
                 "1y":  { sec: 366 * 86400, table: "hvac_rollup_1h", label: "1 year" } };

async function fetchAll(table, cols, filter) {
  const out = []; const page = 10000;
  for (let from = 0; ; from += page) {
    let q = state.sb.from(table).select(cols).range(from, from + page - 1);
    q = filter(q);
    const { data, error } = await q;
    if (error) throw new Error(`${table}: ${error.message}`);
    out.push(...data);
    if (data.length < page) break;
  }
  return out;
}

function fmtVal(p, v) {

  if (p.kind === "multistate") { const t = p.state_texts; const s = t && t[v - 1]; return s ? (STATE_WORDS[s] || s) : `state ${v}`; }
  return Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1);
}

  "cubic-feet-per-minute": "CFM", "parts-per-million": "ppm", "volts": "V", "amperes": "A", "kilowatts": "kW" }[u] || u.replace(/-/g, " "); }

// Click a heading to sort that table (Russ, 2026-11-05). Cells can carry data-sort for the real value (dates, numbers);
// the chosen column and direction are kept per table key so a minute-refresh rebuild keeps the order.
const sortState = {};
function sortable(table, key) {
  const ths = [...table.querySelectorAll("thead th")];
  const apply = () => {
    const st = sortState[key]; ths.forEach((th, i) => { th.dataset.dir = st && i === st.col ? st.dir : ""; });
    if (!st) return;
    const tb = table.tBodies[0]; if (!tb) return;
    const val = (r) => { const td = r.cells[st.col]; return td ? (td.dataset.sort != null ? td.dataset.sort : td.textContent.trim()) : ""; };
    const rows = [...tb.rows].map((r, i) => [r, i]);
    rows.sort(([a, ia], [b, ib]) => {
      const x = val(a), y = val(b); const nx = Number(x), ny = Number(y);
      let c = x !== "" && y !== "" && !isNaN(nx) && !isNaN(ny) ? nx - ny : String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" });
      if (x === "" && y !== "") c = 1; else if (y === "" && x !== "") c = -1;   // blanks last either way
      return c ? (st.dir === "desc" ? -c : c) : ia - ib;
    });
    tb.append(...rows.map(([r]) => r));
  };
  ths.forEach((th, i) => {
    if (!th.textContent.trim()) return;
    th.classList.add("sortable"); th.title = "Click to sort";
    th.addEventListener("click", () => { const st = sortState[key]; sortState[key] = { col: i, dir: st && st.col === i && st.dir === "asc" ? "desc" : "asc" }; apply(); });
  });
  apply();
}

  const louver = (x, y, text) => { let s = `<rect x="${x - 10}" y="${y - 22}" width="20" height="44" fill="${surface}" stroke="${ink2}" stroke-width="1.5"/>`; for (let i = -16; i <= 16; i += 8) s += `<line x1="${x - 8}" y1="${y + i - 3}" x2="${x + 8}" y2="${y + i + 3}" stroke="${ink2}" stroke-width="1.4"/>`; return s + label(x, y + 34, text, "middle", 8) + label(x, y + 43, "on the outside wall", "middle", 7); };
  const i = AHUS.indexOf(a); const extra = AHU_EXTRA[a.key] || {};

  // --- return side (top): rooms -> RA sensors -> smoke detector -> return fan -> tee: exhaust damper up to the louver, return damper down to the mixing box

  s += label(300, 206, "MIXING", "middle", 7.5, ink2, 700) + label(300, 215, "BOX", "middle", 7.5, ink2, 700);

  // heating coil (hot water from the boilers) with its control valve

  s += label(443, SY + 56, `${extra.valve || "valve"} · water from the boilers`, "middle", 7);
  if (has("HTG-EN") && !on("HTG-EN")) s += label(443, SY - 30, "heating disabled", "middle", 7.5, warn, 700);
  // low-limit (freeze) stat at the coils

// ------------------------------------------------------------------ shared drawing helpers for the Heating loop and Exhaust fans tabs
function svgKit() {
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
  const k = { esc, red: css("--s8"), blue: css("--s1"), ink: css("--ink"), ink2: css("--ink-2"), muted: css("--muted"), surface: css("--surface"), grid: css("--axis"), ductColor: css("--grid"),
              good: css("--good"), bad: css("--critical"), warn: css("--warning"), air: "#5fb8ff" };
  k.num = (name, d = 1, unit = "") => { const p = pt(name); return p && p.last_value != null ? Number(p.last_value).toFixed(d) + unit : "–"; };
  k.val = (name) => { const p = pt(name); return p && p.last_value != null ? Number(p.last_value) : null; };
  k.on = (name) => k.val(name) === 1;
  k.has = (name) => !!pt(name);
  k.txt = (name) => { const p = pt(name); return p ? fmtVal(p, p.last_value) : "–"; };
  k.label = (x, y, text, anchor = "start", size = 11, color = k.muted, weight = 400) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" fill="${color}" font-weight="${weight}">${esc(text)}</text>`;
  k.tag = (x, y, letters, value, side = "r", big = false) => `<circle cx="${x}" cy="${y}" r="12" fill="${k.surface}" stroke="${k.ink2}" stroke-width="1.6"/><text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${k.ink2}">${letters}</text>` +
    `<text x="${side === "r" ? x + 17 : x - 17}" y="${y + (big ? 6 : 5)}" text-anchor="${side === "r" ? "start" : "end"}" font-size="${big ? 17 : 13}" font-weight="700" fill="${k.ink}">${esc(value)}</text>`;
  k.pipe = (d, color, flow, w = 4) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" class="pipe${flow ? " flow" : ""}"/>`;
  k.duct = (d, flowing) => `<path d="${d}" fill="none" stroke="${k.ductColor}" stroke-width="14" stroke-linejoin="round"/>` + (flowing ? `<path d="${d}" fill="none" stroke="${k.air}" stroke-width="3" stroke-linejoin="round" class="pipe flow"/>` : "");
  k.arrow = (x, y, dir, color = k.ink2, s = 6) => { const pts = dir === "r" ? `${x - s},${y - s} ${x + s},${y} ${x - s},${y + s}` : dir === "l" ? `${x + s},${y - s} ${x - s},${y} ${x + s},${y + s}` : dir === "d" ? `${x - s},${y - s} ${x},${y + s} ${x + s},${y - s}` : `${x - s},${y + s} ${x},${y - s} ${x + s},${y + s}`; return `<polygon points="${pts}" fill="${color}"/>`; };
  // control valve: bowtie, a third triangle below for a 3-way, drawn solid when open
  k.valve = (x, y, kind, open) => { const f = open ? k.red : k.surface; let s = `<g transform="translate(${x},${y})"><polygon points="-8,-6 8,6 8,-6 -8,6" fill="${f}" stroke="${k.ink2}" stroke-width="1.5"/>`;
    if (kind === "3-way") s += `<polygon points="0,0 -6,10 6,10" fill="${f}" stroke="${k.ink2}" stroke-width="1.5"/>`; if (kind === "zone") s += `<line x1="0" y1="-6" x2="0" y2="-13" stroke="${k.ink2}" stroke-width="1.5"/><rect x="-5" y="-19" width="10" height="6" fill="${k.surface}" stroke="${k.ink2}" stroke-width="1.2"/>`;
    return s + `</g>`; };
  k.fan = (x, y, run, alarm, r = 17) => { const stroke = alarm ? k.bad : run ? k.good : k.grid; const blade = `<path d="M ${x} ${y} l 10 -12 a ${r} ${r} 0 0 1 2 20 z" fill="${stroke}" opacity=".8"/>`;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${k.surface}" stroke="${stroke}" stroke-width="${run || alarm ? 3.5 : 2}"/><g>${run ? `<animateTransform attributeName="transform" type="rotate" from="0 ${x} ${y}" to="360 ${x} ${y}" dur="0.9s" repeatCount="indefinite"/>` : ""}${blade}<g transform="rotate(120 ${x} ${y})">${blade}</g><g transform="rotate(240 ${x} ${y})">${blade}</g></g><circle cx="${x}" cy="${y}" r="2.5" fill="${k.ink2}"/>`; };
  k.pump = (x, y, run, alarm, r = 14) => { const stroke = alarm ? k.bad : run ? k.good : k.grid;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${k.surface}" stroke="${stroke}" stroke-width="${run || alarm ? 3.5 : 2}"/><path d="M ${x} ${y} l 9 -10 a ${r} ${r} 0 0 1 1 17 z" fill="${stroke}" opacity=".85"/>`; };
  return k;
}

async function boot() {

  }

  state.sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  $("#signout").onclick = () => state.sb.auth.signOut();

    state.user = session?.user || null;
    $("#signout").style.display = state.user ? "" : "none";
    $("#who").textContent = state.user ? (state.user.email || "") : "";
    if (!state.user) { showLogin(); return; }
    // own allow-list row (admins get the whole list back, so pick out the own row by email)
    const me = String(state.user.email || "").toLowerCase();
    let { data, error } = await state.sb.from("hvac_allowed_users").select("email,is_admin");
    if (error && /is_admin/.test(error.message)) ({ data, error } = await state.sb.from("hvac_allowed_users").select("email"));   // 008_admin.sql not run yet
    const mine = !error && (data || []).find(r => String(r.email).toLowerCase() === me);
    if (!mine) { showNotAllowed(state.user.email); return; }
    state.admin = !!mine.is_admin;
    try { await loadPoints(); renderTab(); }
    catch (e) { screen(el("div", { class: "card" }, "Could not load points: " + (e.message || e))); }
  };
  const hash = location.hash || "";
  if (/error=/.test(hash)) {
    const q = new URLSearchParams(hash.slice(1));
    history.replaceState(null, "", location.pathname);
    showLogin("Sign-in problem: " + (q.get("error_description") || q.get("error") || "unknown") + ". Please try again.");
    return;
  }
  const { data: { session } } = await state.sb.auth.getSession();
  await onSession(session);
  state.sb.auth.onAuthStateChange((event, s) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "USER_UPDATED") onSession(s); });
