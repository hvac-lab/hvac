<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morris North HVAC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --band: rgba(42,120,214,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); color: var(--ink-2); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--good); } .pill.warn .dot { background: var(--warning); } .pill.bad .dot { background: var(--critical); }
  nav.tabs { display:flex; gap: 4px; padding: 8px 16px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button { border: 1px solid transparent; border-bottom: none; background: none; border-radius: 10px 10px 0 0; padding: 8px 16px; font-size: 15px; color: var(--ink-2); }
  nav.tabs button.on { background: var(--page); border-color: var(--border); color: var(--ink); font-weight: 650; margin-bottom: -1px; }
  button, select, input[type=search], input[type=number], input[type=text] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  input[type=number] { width: 90px; padding: 6px 8px; } input[type=text] { padding: 6px 8px; }
  button { cursor: pointer; } button:hover { background: var(--hover); } button:disabled { opacity: .5; cursor: default; }
  button.on { border-color: var(--ink); font-weight: 650; }
  button.primary { background: var(--s1); color: #fff; border-color: transparent; padding: 10px 18px; font-weight: 600; }
  button.small { padding: 3px 10px; font-size: 13px; }
  button.danger { color: var(--critical); }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom: 14px; }
  .filters .group { display:flex; gap:4px; }
  .filters label.chk { display:inline-flex; align-items:center; gap:5px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; background: var(--surface); position: relative; }
  .tile:hover { background: var(--hover); } .tile.sel { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--sc, var(--ink)); }
  .tile .name { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .val { font-size: 22px; font-weight: 650; margin: 2px 0; }
  .tile .val small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .tile .meta { font-size: 11px; color: var(--muted); display:flex; gap:6px; flex-wrap: wrap; }
  .ahus { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .ahu { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; border-top: 4px solid var(--ac, var(--border)); }
  .ahu h3 { margin: 0; font-size: 15px; } .ahu .where { font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
  .ahu .big { font-size: 34px; font-weight: 650; line-height: 1.1; } .ahu .big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .ahu .row { display:flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-top: 1px solid var(--grid); }
  .ahu .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ahu .foot { font-size: 11px; color: var(--muted); margin-top: 6px; display:flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .badge.ovr { border-color: var(--warning); } .badge.unr, .badge.err, .badge.critical { border-color: var(--critical); color: var(--critical); }
  .badge.alm, .badge.warning { border-color: var(--serious); } .badge.ok { border-color: var(--good); color: var(--good); }
  .grp { margin: 10px 0 4px; font-size: 13px; color: var(--muted); display:flex; align-items:center; gap:8px; }
  .chart { margin-bottom: 14px; }
  .chart h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .uplot { font-family: inherit; }
  .u-legend { font-size: 12px; color: var(--ink-2); }
  .u-legend .u-marker { border-radius: 2px; }
  .u-legend .u-value { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .u-select { background: var(--band); }
  .u-cursor-x { border-right: 1px dashed var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tablewrap { max-height: 60vh; overflow: auto; }
  .center { max-width: 460px; margin: 10vh auto; text-align: center; }
  .center p { color: var(--ink-2); }
  #picker { position: relative; }
  #picklist { position: absolute; z-index: 10; top: 38px; left: 0; width: 360px; max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); display: none; }
  #picklist.open { display: block; }
  #picklist label { display: flex; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #picklist label:hover { background: var(--hover); }
  #picklist .g { font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .dim { opacity: .5; }
  .ctl { display: grid; grid-template-columns: 1.4fr auto auto auto auto 1.6fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
  .ctl .name { font-weight: 600; } .ctl .name small { font-weight: 400; color: var(--muted); display: block; font-size: 12px; }
  .ctl .cur { font-variant-numeric: tabular-nums; }
  .ctl .last { font-size: 12px; color: var(--ink-2); }
  .rules input[type=text] { width: 100%; min-width: 170px; } .rules select { padding: 4px 6px; } .rules input[type=number] { width: 72px; padding: 4px 6px; }
  .alert { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
  .alert time { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 110px; }
  .msg { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .map { position: relative; display: inline-block; max-width: 100%; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .map img { display: block; max-width: 100%; height: auto; }
  .spot { position: absolute; transform: translate(-50%, -100%); background: var(--surface); border: 2px solid var(--sc, var(--s1)); border-radius: 10px; padding: 4px 9px; font-size: 14px; font-weight: 650; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.2); line-height: 1.2; }
  .spot small { display:block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .spot::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: var(--sc, var(--s1)); border-radius: 50%; transform: translateX(-50%); }
  .coords { position: absolute; right: 8px; bottom: 8px; font: 12px/1.2 monospace; background: rgba(0,0,0,.65); color: #fff; padding: 3px 6px; border-radius: 6px; pointer-events: none; }
  @media (max-width: 760px) { .ctl { grid-template-columns: 1fr 1fr; } .ctl .last { grid-column: 1 / -1; } }
  @media (max-width: 600px) { header h1 { font-size: 16px; } main { padding: 12px; } .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } nav.tabs button { padding: 8px 10px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Morris North HVAC</h1>
  <span id="status" class="pill"><span class="dot"></span><span id="statusText">connecting</span></span>
  <span class="spacer"></span>
  <span id="who" class="hint"></span>
  <button id="themeBtn" title="Light / dark">◐</button>
  <button id="signout" style="display:none">Sign out</button>
</header>
<nav class="tabs" id="tabs" style="display:none"></nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
// ------------------------------------------------------------------ building configuration
// The engine names the air handlers by controller (FEC-6/7/8); the Metasys screens call them AHU-1/2/3.
// AHU-1 = FEC-6 was confirmed from logged values on 2026-11-05; AHU-2/3 follow the same order (to confirm).
const AHUS = [
  { key: "AHU-1", fec: "FEC-6", name: "AHU-1", where: "Fellowship Area, Main Entry" },
  { key: "AHU-2", fec: "FEC-7", name: "AHU-2", where: "Kitchen and Dining" },
  { key: "AHU-3", fec: "FEC-8", name: "AHU-3", where: "Worship Area" },
];
// Map tab: a picture of the building (map.png next to this file) and where to draw temperatures on it.
// x/y are percent of the picture's width/height; the Map tab shows the pointer's x/y to help place them.
const MAP = {
  image: "map.png",
  spots: [
    { label: "Fellowship", point: "FEC-6.ZN-T", x: 30, y: 40 },
    { label: "Kitchen / Dining", point: "FEC-7.ZN-T", x: 60, y: 40 },
    { label: "Worship", point: "FEC-8.ZN-T", x: 45, y: 72 },
  ],
};

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const opt = (value, text, selected) => { const o = el("option", { value }, text); if (selected) o.selected = true; return o; };
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const MAX_SEL = 8;
const RANGES = { "24h": { sec: 86400, table: "hvac_samples_1m", label: "24 hours" },
                 "7d":  { sec: 7 * 86400, table: "hvac_rollup_15m", label: "7 days" },
                 "30d": { sec: 30 * 86400, table: "hvac_rollup_15m", label: "30 days" },
                 "1y":  { sec: 366 * 86400, table: "hvac_rollup_1h", label: "1 year" } };
const FLAG = { alarm: 1, fault: 2, overridden: 4, oos: 8, unreliable: 16, readError: 32 };
const CONDITIONS = { below: "below", above: "above", deviation: "differs from point 2 by more than", unreliable: "reports Unreliable", read_error: "cannot be read", equals: "equals", not_equals: "is not" };
const DURATIONS = [["", "until released"], ["60", "1 hour"], ["120", "2 hours"], ["240", "4 hours"], ["480", "8 hours"], ["720", "12 hours"], ["1440", "24 hours"]];
const TABS = [["temp", "Temperature"], ["details", "Details"], ["map", "Map"]];
const demo = new URLSearchParams(location.search).get("demo") === "1";
const store = { get(k, d) { try { const v = localStorage.getItem("hvac." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("hvac." + k, JSON.stringify(v)); } catch {} } };

const state = { sb: null, user: null, points: [], byId: new Map(), byName: new Map(), sel: store.get("sel", []), range: store.get("range", "24h"),
                tab: store.get("tab", "temp"), table: false, charts: [], data: null, timer: null, status: null, alerts: [], rules: [], cmds: [], cmdTimer: null,
                tempAhus: store.get("tempAhus", AHUS.map(a => a.key)), tempKinds: store.get("tempKinds", ["zone", "discharge"]), tempRange: store.get("tempRange", "24h") };

// ------------------------------------------------------------------ theme
const applyTheme = () => { const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
$("#themeBtn").onclick = () => { const cur = store.get("theme", null); const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur === "dark" : dark; store.set("theme", isDark ? "light" : "dark"); applyTheme(); if (state.points.length) renderTab(); };
applyTheme();
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ------------------------------------------------------------------ screens
const main = $("#main");
function screen(...kids) { main.replaceChildren(...kids); }
function setStatus(cls, text) { const p = $("#status"); p.className = "pill " + cls; $("#statusText").textContent = text; }
function showSetup() {
  screen(el("div", { class: "center" }, el("h2", {}, "Configuration missing"),
    el("p", {}, "web/config.js is not present. Copy config.example.js to config.js and fill in the Supabase URL and anon key.")));
  setStatus("bad", "no config");
}
function showLogin(note) {
  $("#tabs").style.display = "none";
  const email = el("input", { type: "text", placeholder: "your email address", style: "width:100%;max-width:320px;padding:10px 12px;font-size:16px", autocomplete: "email" });
  try { email.value = store.get("email", "") || ""; } catch {}
  const msg = el("p", { class: "hint" }, note || "");
  const btn = el("button", { class: "primary", onclick: async () => {
    const addr = email.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)) { msg.textContent = "That does not look like an email address."; return; }
    btn.disabled = true; msg.textContent = "Sending…";
    const { error } = await state.sb.auth.signInWithOtp({ email: addr, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    btn.disabled = false;
    if (error) { msg.textContent = "Could not send: " + error.message; return; }
    store.set("email", addr);
    msg.textContent = `Check ${addr} for a message from Morris North HVAC and click its link. It is valid for a few minutes; the link opens this page signed in.`;
  } }, "Email me a sign-in link");
  email.addEventListener("keydown", (e) => { if (e.key === "Enter") btn.click(); });
  screen(el("div", { class: "center" }, el("h2", {}, "Morris North HVAC"),
    el("p", {}, "Temperatures, setpoints and equipment status of the church building, logged every minute."),
    el("p", {}, email), el("p", {}, btn), msg,
    el("p", { class: "hint" }, "Only addresses on the allow list can see anything. Ask Russ to be added.")));
  setStatus("", "signed out");
}
function showNotAllowed(email) {
  $("#tabs").style.display = "none";
  screen(el("div", { class: "center" }, el("h2", {}, "Not on the list"),
    el("p", {}, `${email} is signed in but not allowed to view this page. Ask Russ to add it.`),
    el("button", { onclick: () => state.sb.auth.signOut() }, "Sign out")));
  setStatus("warn", "not allowed");
}

// ------------------------------------------------------------------ data access
async function fetchAll(table, cols, filter) {
  const out = []; const page = 10000;
  for (let from = 0; ; from += page) {
    let q = state.sb.from(table).select(cols).range(from, from + page - 1);
    q = filter(q);
    const { data, error } = await q;
    if (error) throw new Error(`${table}: ${error.message}`);
    out.push(...data);
    if (data.length < page) break;
  }
  return out;
}
async function loadPoints() {
  if (demo) state.points = demoPoints();
  else state.points = await fetchAll("hvac_points", "id,display_name,group_name,kind,units,state_texts,writable,enabled,last_value,last_ts,last_flags,command_rule",
      q => q.eq("enabled", true).order("group_name").order("display_name"));
  state.byId = new Map(state.points.map(p => [p.id, p]));
  state.byName = new Map(state.points.map(p => [p.display_name, p]));
  state.sel = state.sel.filter(id => state.byId.has(id));
  if (!state.sel.length) state.sel = state.points.filter(p => /ZN-T$/.test(p.display_name)).slice(0, 4).map(p => p.id);
}
async function loadStatus() {
  if (demo) { state.status = { last_seen: new Date().toISOString(), last_cycle_ms: 400, points_ok: 331, points_err: 0 }; return; }
  const { data } = await state.sb.from("hvac_poller_status").select("*").eq("id", 1).maybeSingle();
  state.status = data;
}
async function loadExtras() {
  if (demo) { if (!state.rules.length) demoExtras(); return; }
  const [a, r, c] = await Promise.all([
    state.sb.from("hvac_alert_events").select("*").order("ts", { ascending: false }).limit(20),
    state.sb.from("hvac_alert_rules").select("*").order("id"),
    state.sb.from("hvac_commands").select("*").order("id", { ascending: false }).limit(12)]);
  state.alerts = a.data || []; state.rules = r.data || []; state.cmds = c.data || [];
}
async function loadSeries(ids, rangeKey) {
  const r = RANGES[rangeKey]; const since = new Date(Date.now() - r.sec * 1000).toISOString();
  if (!ids.length) return { rows: [], table: r.table };
  if (demo) return { rows: demoRows(ids, r), table: r.table };
  const cols = r.table === "hvac_samples_1m" ? "point_id,ts,value,flags" : "point_id,ts,vavg,vmin,vmax";
  const rows = await fetchAll(r.table, cols, q => q.in("point_id", ids).gte("ts", since).order("ts"));
  return { rows, table: r.table };
}
async function insertCommand(p, value, release, duration) {
  const row = { point_id: p.id, value: release ? null : value, priority: 8, release, duration_min: duration || null,
                created_by: state.user?.email || "demo", status: "pending" };
  if (demo) { state.cmds.unshift({ id: Date.now(), created_at: new Date().toISOString(), ...row }); setTimeout(() => { state.cmds[0].status = "done"; state.cmds[0].result = "confirmed (demo)"; renderExtras(); }, 3000); return; }
  const { error } = await state.sb.from("hvac_commands").insert(row);
  if (error) throw new Error(error.message);
}
async function saveRule(rule) {
  if (demo) { if (!rule.id) { rule.id = Date.now(); state.rules.push(rule); } return; }
  const body = { name: rule.name, point_id: rule.point_id, point2_id: rule.point2_id || null, condition: rule.condition, threshold: rule.threshold,
                 for_minutes: rule.for_minutes, level: rule.level, enabled: rule.enabled, updated_at: new Date().toISOString() };
  const q = rule.id ? state.sb.from("hvac_alert_rules").update(body).eq("id", rule.id) : state.sb.from("hvac_alert_rules").insert(body);
  const { error } = await q;
  if (error) throw new Error(error.message);
}
async function deleteRule(id) {
  if (demo) { state.rules = state.rules.filter(r => r.id !== id); return; }
  const { error } = await state.sb.from("hvac_alert_rules").delete().eq("id", id);
  if (error) throw new Error(error.message);
}

// ------------------------------------------------------------------ formatting
function fmtVal(p, v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  if (p.kind === "binary") { const t = p.state_texts; return t && t[v] ? t[v] : (v ? "On" : "Off"); }
  if (p.kind === "multistate") { const t = p.state_texts; return t && t[v - 1] ? t[v - 1] : `state ${v}`; }
  return Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1);
}
function unitLabel(u) { if (!u || u === "no-units") return ""; return { "degrees-fahrenheit": "°F", "degrees-celsius": "°C", "percent": "%", "percent-relative-humidity": "% RH",
  "inches-of-water": "in. w.c.", "pounds-force-per-square-inch": "psi", "seconds": "s", "minutes": "min", "btus-per-pound": "BTU/lb",

        el("td", {}, c.release ? "release" : (p ? fmtVal(p, Number(c.value)) : c.value) + (c.duration_min ? ` for ${c.duration_min} min` : "")),
        el("td", {}, el("span", { class: "badge " + (c.status === "done" ? "ok" : c.status === "failed" ? "critical" : "") }, c.status), " ", c.result || "", c.released_at ? ` (released ${when(c.released_at)})` : "")));

function watchCommands() {
  clearInterval(state.cmdTimer); let n = 0;
  state.cmdTimer = setInterval(async () => { n++; try { await loadExtras(); await loadPoints(); buildTiles(); renderControls(); } catch {} if (n >= 9) clearInterval(state.cmdTimer); }, 10000);

function renderAlerts() {
  const box = $("#alerts"); if (!box) return;
  box.replaceChildren(el("h2", {}, "Alerts"));
  if (!state.alerts.length) { box.append(el("div", { class: "hint" }, "No alerts so far.")); return; }

      a.cleared_at ? el("span", { class: "hint" }, `cleared ${when(a.cleared_at)}`) : el("span", { class: "badge critical" }, "active")));

function renderRules() {
  const box = $("#rules"); if (!box) return;
  box.replaceChildren(el("h2", {}, "Alert rules"), el("div", { class: "hint" }, "An alert fires when the condition has held for the given minutes, and clears by itself. Critical and warning go to phone and email; info to phone only."));
  const t = el("table", { class: "rules" }, el("thead", {}, el("tr", {}, el("th", {}, "Name"), el("th", {}, "Point"), el("th", {}, "Condition"), el("th", {}, "Value"), el("th", {}, "Point 2"), el("th", {}, "Minutes"), el("th", {}, "Level"), el("th", {}, "On"), el("th", {}, ""))));
  const b = el("tbody");
  const rows = [...state.rules, { id: null, name: "", point_id: state.points[0]?.id, condition: "below", threshold: null, point2_id: null, for_minutes: 15, level: "warning", enabled: true, _new: true }];

function ruleRow(r) {
  const pointSel = (val, allowNone) => el("select", {}, ...(allowNone ? [opt("", "—", !val)] : []), ...state.points.map(p => opt(p.id, p.display_name, p.id === val)));
  const name = el("input", { type: "text", value: r.name || "", placeholder: r._new ? "new rule…" : "" });
  const p1 = pointSel(r.point_id, false), p2 = pointSel(r.point2_id, true);
  const cond = el("select", {}, ...Object.entries(CONDITIONS).map(([k, v]) => opt(k, v, k === r.condition)));
  const thr = el("input", { type: "number", step: "0.5", value: r.threshold ?? "" });
  const mins = el("input", { type: "number", min: 0, max: 1440, value: r.for_minutes ?? 15 });
  const lvl = el("select", {}, ...["critical", "warning", "info"].map(l => opt(l, l, l === r.level)));
  const on = el("input", { type: "checkbox" }); on.checked = r.enabled !== false;
  const status = el("span", { class: "hint" });
  const sync = () => { const c = cond.value; thr.disabled = c === "unreliable" || c === "read_error"; p2.disabled = c !== "deviation"; };
  cond.addEventListener("change", sync); sync();
  const save = el("button", { class: "small", onclick: async () => {
    const rule = { id: r.id, name: name.value.trim(), point_id: Number(p1.value), point2_id: p2.value ? Number(p2.value) : null, condition: cond.value,
                   threshold: thr.disabled || thr.value === "" ? null : Number(thr.value), for_minutes: Number(mins.value) || 0, level: lvl.value, enabled: on.checked };
    if (!rule.name) { status.textContent = "name?"; return; }
    if (!thr.disabled && rule.threshold === null) { status.textContent = "value?"; return; }
    if (cond.value === "deviation" && !rule.point2_id) { status.textContent = "point 2?"; return; }
    try { await saveRule(rule); status.textContent = "saved"; await loadExtras(); renderRules(); } catch (e) { status.textContent = e.message; }
  } }, r._new ? "Add" : "Save");
  const del = r._new ? null : el("button", { class: "small danger", onclick: async () => { if (!confirm(`Delete rule "${r.name}"?`)) return; try { await deleteRule(r.id); await loadExtras(); renderRules(); } catch (e) { status.textContent = e.message; } } }, "✕");
  return el("tr", {}, el("td", {}, name), el("td", {}, p1), el("td", {}, cond), el("td", {}, thr), el("td", {}, p2), el("td", {}, mins), el("td", {}, lvl), el("td", {}, on), el("td", {}, save, " ", del, " ", status));
}

// ------------------------------------------------------------------ demo data (?demo=1, no Supabase needed)
function demoPoints() {
  const mk = (id, name, group, kind, units, v, flags = 0, st = null, cr = null) => ({ id, display_name: name, group_name: group, kind, units, state_texts: st, writable: !!cr, enabled: true, last_value: v, last_ts: new Date().toISOString(), last_flags: flags, command_rule: cr });
  const states = ["Satisfied", "Econ", "Econ+Mech", "HX Cool+Mech", "HX Heat", "HX Heat+Preheat", "HX Heat+Preheat+Reheat", "Cooling Idle", "Heating Idle", "Temperature Unreliable"];
  const out = []; let id = 1;
  [["FEC-6", 68.5, 71.3], ["FEC-7", 68.6, 68.0], ["FEC-8", 68.7, 68.2]].forEach(([fec, zn, da], i) => {
    out.push(mk(id++, `${fec}.ZN-T`, fec, "analog", "degrees-fahrenheit", zn, i === 2 ? 16 : 0));
    out.push(mk(id++, `${fec}.DA-T`, fec, "analog", "degrees-fahrenheit", da));
    out.push(mk(id++, `${fec}.ZNT-SP`, fec, "analog", "degrees-fahrenheit", 70, i === 0 ? 4 : 0, null, { min: 60, max: 80, priority: 8, label: "Zone setpoint" }));
    out.push(mk(id++, `${fec}.SF-S`, fec, "binary", null, i === 1 ? 1 : 0, 0, ["Off", "On"]));
    out.push(mk(id++, `${fec}.AHU-STATE`, fec, "multistate", null, 7 + i, 0, states));
    out.push(mk(id++, `${fec}.ZN-TOCC`, fec, "binary", null, 0, 0, ["Inactive", "Active"], { values: [0, 1], priority: 8, label: "Temporary occupancy" }));
  });
  out.push(mk(id++, "Boiler-1&2.AV-303", "Boiler-1&2", "analog", "no-units", 103));
  return out;
}
function demoExtras() {
  const now = Date.now();
  state.alerts = [{ id: 2, ts: new Date(now - 3600e3).toISOString(), level: "warning", message: "FEC-8.ZN-T reports Unreliable for 30 min (value 68.9 °F)", cleared_at: null },
                  { id: 1, ts: new Date(now - 86400e3).toISOString(), level: "critical", message: "FEC-6.ZN-T is 52.1 °F, below 55.0 °F for 15 min", cleared_at: new Date(now - 80000e3).toISOString() }];
  state.rules = [{ id: 1, name: "Freeze risk FEC-6 zone", point_id: 1, condition: "below", threshold: 55, for_minutes: 15, level: "critical", enabled: true },
                 { id: 2, name: "FEC-6 not holding setpoint", point_id: 1, point2_id: 3, condition: "deviation", threshold: 6, for_minutes: 120, level: "warning", enabled: true }];
  state.cmds = [{ id: 1, created_at: new Date(now - 7200e3).toISOString(), created_by: "russ@example.org", point_id: 3, value: 72, release: false, duration_min: 240, status: "done", result: "confirmed 72.0", released_at: null }];
}
function demoRows(ids, r) {
  const step = r.table === "hvac_samples_1m" ? 60 : r.table === "hvac_rollup_15m" ? 900 : 3600; const n = Math.floor(r.sec / step); const now = Math.floor(Date.now() / 1000 / step) * step;
  const rows = [];
  for (const id of ids) { const p = state.byId.get(id); for (let i = n; i >= 0; i--) { const t = now - i * step; let v;
    if (p.kind === "analog") v = (p.last_value || 68) + 3 * Math.sin(t / 7000 + id) + (Math.random() - .5); else if (p.kind === "binary") v = Math.sin(t / 5000) > 0 ? 1 : 0; else v = 1 + Math.floor((Math.sin(t / 9000) + 1) * 4.4);
    if (r.table === "hvac_samples_1m") rows.push({ point_id: id, ts: new Date(t * 1000).toISOString(), value: v, flags: 0 });
    else rows.push({ point_id: id, ts: new Date(t * 1000).toISOString(), vavg: v, vmin: v - (p.kind === "analog" ? .8 : 0), vmax: v + (p.kind === "analog" ? .8 : 0) }); } }
  return rows;
}

// ------------------------------------------------------------------ boot
async function boot() {
  const cfg = window.HVAC_CONFIG;
  if (cfg && cfg.TITLE) { $("#title").textContent = cfg.TITLE; document.title = cfg.TITLE; }
  if (demo) { $("#who").textContent = "demo data"; await loadPoints(); renderTab(); return; }
  if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.includes("xxxx")) { showSetup(); return; }
  state.sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  $("#signout").onclick = () => state.sb.auth.signOut();
  const onSession = async (session) => {
    state.user = session?.user || null;
    $("#signout").style.display = state.user ? "" : "none";
    $("#who").textContent = state.user ? (state.user.email || "") : "";
    if (!state.user) { showLogin(); return; }
    const { data, error } = await state.sb.from("hvac_allowed_users").select("email").limit(1);
    if (error || !data || !data.length) { showNotAllowed(state.user.email); return; }
    try { await loadPoints(); renderTab(); }
    catch (e) { screen(el("div", { class: "card" }, "Could not load points: " + (e.message || e))); }
  };
  const hash = location.hash || "";
  if (/error=/.test(hash)) {
    const q = new URLSearchParams(hash.slice(1));
    history.replaceState(null, "", location.pathname);
    showLogin("Sign-in link problem: " + (q.get("error_description") || q.get("error") || "unknown") + ". Request a new link.");
    return;
  }
  const { data: { session } } = await state.sb.auth.getSession();
  await onSession(session);
  state.sb.auth.onAuthStateChange((event, s) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "USER_UPDATED") onSession(s); });
}
boot();
